name: Update Footer

on:
  push:
    branches:
      - main   

jobs:
  update-footer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update footer.html
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          export TZ="Asia/Ho_Chi_Minh"
          DATE=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s|<p>.*</p>|<p>© Github. Last updated: $DATE — Commit: $COMMIT_HASH</p>|" components/footer.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/footer.html
          git commit -m "chore: update footer [skip ci]" || echo "No changes"
          git push

      - name: Xóa logs GitHub Actions cũ (Tự động)
        if: success()
        run: |
          echo "🔄 Đang xóa logs GitHub Actions cũ..."
          
          # Cài đặt GitHub CLI nếu chưa có
          if ! command -v gh &> /dev/null; then
              echo "📦 Đang cài đặt GitHub CLI..."
              type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
              sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt update
              sudo apt install gh -y
          fi

          # Đăng nhập GitHub CLI với token
          echo "🔐 Đang đăng nhập GitHub CLI..."
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

          # Lấy danh sách tất cả runs và xóa (không cần xác nhận)
          echo "🗑️ Đang lấy danh sách runs để xóa..."
          runs=$(gh run list --repo ${{ github.repository }} --limit 100 --json databaseId --jq ".[].databaseId")
          
          if [ -z "$runs" ]; then
              echo "✅ Không có logs nào để xóa!"
              exit 0
          fi

          count=$(echo "$runs" | wc -l)
          echo "📊 Tìm thấy $count runs để xóa"

          # Xóa từng run
          success_count=0
          error_count=0
          
          for run_id in $runs; do
              if gh run delete "$run_id" --repo ${{ github.repository }}; then
                  echo "✅ Đã xóa run: $run_id"
                  success_count=$((success_count + 1))
              else
                  echo "❌ Lỗi khi xóa run: $run_id"
                  error_count=$((error_count + 1))
              fi
              sleep 0.1 # Nghỉ giữa các request
          done

          echo "🎉 Hoàn thành! Đã xóa $success_count runs, lỗi: $error_count"