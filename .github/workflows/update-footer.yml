name: Update Footer

on:
  push:
    branches:
      - main   

# THÊM PERMISSIONS Ở ĐÂY
permissions:
  actions: write  # Quyền xóa workflow runs
  contents: write # Quyền write cho repository

jobs:
  update-footer:
    runs-on: ubuntu-latest

    # Có thể thêm permissions ở job level nếu cần
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Cần token có quyền write
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update footer.html
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          export TZ="Asia/Ho_Chi_Minh"
          DATE=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s|<p>.*</p>|<p>© Github. Last updated: $DATE — Commit: $COMMIT_HASH</p>|" components/footer.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/footer.html
          git commit -m "chore: update footer [skip ci]" || echo "No changes"
          git push

      - name: Xóa logs GitHub Actions cũ
        if: success()
        run: |
          echo "🔄 Đang xóa logs GitHub Actions cũ..."
          
          # Cài đặt GitHub CLI
          if ! command -v gh &> /dev/null; then
              echo "📦 Đang cài đặt GitHub CLI..."
              type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
              sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt update
              sudo apt install gh -y
          fi

          # Đăng nhập với token
          echo "🔐 Đang đăng nhập GitHub CLI..."
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

          # Xóa runs - CHỈ XÓA NHỮNG RUNS ĐÃ HOÀN THÀNH
          echo "🗑️ Đang lấy danh sách runs đã hoàn thành để xóa..."
          runs=$(gh run list --repo ${{ github.repository }} --limit 50 --status completed --json databaseId --jq ".[].databaseId")
          
          if [ -z "$runs" ]; then
              echo "✅ Không có logs nào để xóa!"
              exit 0
          fi

          count=$(echo "$runs" | wc -l)
          echo "📊 Tìm thấy $count runs đã hoàn thành để xóa"

          success_count=0
          error_count=0
          
          for run_id in $runs; do
              if gh run delete "$run_id" --repo ${{ github.repository }}; then
                  echo "✅ Đã xóa run: $run_id"
                  success_count=$((success_count + 1))
              else
                  echo "❌ Lỗi khi xóa run: $run_id"
                  error_count=$((error_count + 1))
              fi
              sleep 0.2
          done

          echo "🎉 Hoàn thành! Đã xóa $success_count runs, lỗi: $error_count"