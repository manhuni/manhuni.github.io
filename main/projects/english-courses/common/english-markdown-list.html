<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Think English | My Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/css/english-markdown-list.css" />
    <link rel="stylesheet" href="/main/projects/english-courses/assets/css/lesson-common-nav.css" />
    <link rel="stylesheet" href="/assets/css/markdown.css" />

</head>

<body>
    <div id="header"></div>

    <main class="site-main container">
        <section class="hero dashboard-hero">
            <h1>💡 Think English – Tư duy & Phản xạ Tiếng Anh</h1>
            <p>Học cách dùng tiếng Anh **không cần dịch**, phản xạ tự nhiên, thực dụng – dùng được ngay trong đàm phán,
                thương lượng, giao tiếp chuyên nghiệp.</p>
        </section>

        <section class="lesson-content">
            <div class="md-links">
                <a href="#" data-md="../assets/md/verbs-tenses/lesson1.md">Lesson 1</a>
                <a href="#" data-md="../assets/md/verbs-tenses/lesson2.md">Lesson 2</a>
                <a href="#" data-md="../assets/md/verbs-tenses/lesson3.md">Lesson 3</a>
            </div>
        </section>
        <!-- Popup -->
        <div class="popup-overlay" id="popup">
            <div class="popup-content markdown-body">
                <span class="popup-close" id="popup-close">&times;</span>
                <div id="popup-md"></div>
            </div>
        </div> 
        <script>
            const popup = document.getElementById("popup");
            const popupContent = document.getElementById("popup-md");
            const closeBtn = document.getElementById("popup-close");

            document.querySelectorAll(".md-links a").forEach(link => {
                link.addEventListener("click", e => {
                    e.preventDefault();
                    const file = link.getAttribute("data-md");
                    fetch(file)
                        .then(res => res.text())
                        .then(md => {
                            const html = DOMPurify.sanitize(marked.parse(md));
                            popupContent.innerHTML = html;
                            popup.style.display = "flex";
                        })
                        .catch(err => {
                            popupContent.innerHTML = "<p style='color:red'>Không thể tải file Markdown.</p>";
                            console.error(err);
                        });
                });
            });

            closeBtn.addEventListener("click", () => {
                popup.style.display = "none";
                popupContent.innerHTML = "";
            });

            popup.addEventListener("click", e => {
                if (e.target === popup) {
                    popup.style.display = "none";
                    popupContent.innerHTML = "";
                }
            });
        </script>
    </main>

    <div id="footer"></div>
    <script src="/assets/js/main.js"></script>
    <script src="../assets/js/english-markdown-list.js"></script>
    <script src="../assets/js/lesson-common-nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
</body>

</html>
